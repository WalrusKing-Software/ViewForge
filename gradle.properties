# JVM args for the Gradle daemon. Compose/KotlinPoet builds are memory-hungry.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# Application version — single source of truth for native installer metadata (M10 packaging,
# app/build.gradle.kts nativeDistributions.packageVersion). jpackage constraints: Windows MSI wants
# major.minor.micro with major 0-255 / minor 0-255 / micro 0-65535; macOS wants a major >= 1, so a
# mac release needs an override (documented in _docs/INSTALL.md). Bump on the release/* branch.
viewforge.version=0.1.0

# Compose Multiplatform
org.jetbrains.compose.experimental.jscanvas.enabled=false
