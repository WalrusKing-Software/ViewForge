# Scans the working tree + full git history for committed secrets, using the repo's own
# .gitleaks.toml. Runs the pinned gitleaks binary directly (no Docker) so it behaves identically
# on GitHub and on the homelab Forgejo runner. GitHub copy — mirror of the .forgejo variant.
name: Secret Scan (gitleaks)

on:
  pull_request:
    branches: [main, 'release/*', develop]
  push:
    branches: [main, 'release/*', develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Run gitleaks
        run: |
          ./gitleaks detect \
            --source=. \
            --config=.gitleaks.toml \
            --redact \
            --exit-code 1 \
            --verbose
