# Cross-OS build (PROJECT_PLAN §3.4 "matrix"): verify Windows/macOS/Linux before releases.
# GitHub-ONLY by design: it needs GitHub's hosted Windows/macOS/Linux runners. There is no
# .forgejo copy because a homelab Forgejo has no macOS/Windows runners — such a job would queue
# forever. Cross-OS verification therefore happens on the GitHub mirror.
name: matrix

on:
  push:
    branches: ["release/**", "hotfix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build and test
        run: ./gradlew allTests assemble --no-daemon --stacktrace
