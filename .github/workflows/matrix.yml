# Cross-OS build (PROJECT_PLAN §3.4 "matrix"): verify Windows/macOS/Linux before releases.
# GitHub-ONLY by design: it needs GitHub's hosted Windows/macOS/Linux runners. There is no
# .forgejo copy because a homelab Forgejo has no macOS/Windows runners — such a job would queue
# forever. Cross-OS verification therefore happens on the GitHub mirror.
name: matrix

on:
  push:
    branches: ["release/**", "hotfix/**"]
  pull_request:
    # Cross-OS verification before a release/hotfix lands on main (BRANCHING.md §7). Job contexts
    # are `cross-os (ubuntu-latest)` etc., required by the protect-main ruleset.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build and test
        run: ./gradlew allTests assemble --no-daemon --stacktrace
