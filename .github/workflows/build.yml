# Primary build gate (PROJECT_PLAN §3.4 "build"): compile, lint, and unit-test on Linux.
# GitHub copy — runs on the GitHub mirror. The Forgejo copy lives in .forgejo/workflows/build.yml
# and is what runs on the homelab (Forgejo uses .forgejo/workflows/ exclusively when present).
name: build

on:
  push:
    branches: [develop, "release/*", "feature/**", "bugfix/**", "chore/**", "docs/**", "refactor/**", "test/**"]
  pull_request:
    branches: [develop, "release/*", main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # The fidelity test (:app) renders via Skiko/Compose Desktop; libskiko is dynamically linked
      # against libGL.so.1, so the headless runner needs OpenGL + font libraries present or the test
      # fails to even load the native library. sudo-fallback so this works whether the runner is root
      # (act image) or a non-root user with passwordless sudo.
      - name: Install headless rendering libraries (Skiko)
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else SUDO=""; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends libgl1 libfontconfig1

      - name: Spotless / ktlint check
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: All tests
        run: ./gradlew allTests --no-daemon --stacktrace

      - name: Assemble
        run: ./gradlew assemble --no-daemon --stacktrace
